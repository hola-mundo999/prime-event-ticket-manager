services:
  - type: web
    name: prime-event-ticket-manager
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # Asked for on blueprint sync; the admin console signs in with this.
      - key: ADMIN_TOKEN
        sync: false
