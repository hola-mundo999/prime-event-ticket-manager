services:
  - type: web
    name: prime-event-ticket-manager
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Paste the Supabase pooler URI here. Without it the API falls back to
      # SQLite on the ephemeral disk, so passes disappear on every redeploy.
      - key: DATABASE_URL
        sync: false
      # Required by MFA. Set values in the Render dashboard, not in this file.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_ENCRYPTION_KEY
        sync: false
